name: Search Index Scraper

on:
  workflow_dispatch:
  # run manually

  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]

jobs:
  scrape:
    # - workflow_run fires on every completed deploy, including failed ones;
    #   only reindex after a successful deploy, otherwise we index the stale site.
    # - run only on the nanocosmos/documentation mirror: documentation-net has no
    #   TYPESENSE_* secrets and would write the same collection anyway.
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
      && github.repository == 'nanocosmos/documentation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Get DocSearch configuration
        id: docsearch-config
        run: echo "json=$(cat typesense-setup/config.json | jq -r tostring)" >> "$GITHUB_OUTPUT"
      - name: Get docsearch scraper docker image
        run: docker pull typesense/docsearch-scraper:0.12.2
      - name: Run DocSearch Scraper
        run: |
          docker run -e CONFIG -e TZ \
          -e TYPESENSE_HOST -e TYPESENSE_API_KEY \
          -e TYPESENSE_PORT -e TYPESENSE_PROTOCOL \
          typesense/docsearch-scraper:0.12.2
        env:
          TZ: UTC
          TYPESENSE_API_KEY: ${{ secrets.TYPESENSE_API_KEY }}
          TYPESENSE_HOST: ${{ secrets.TYPESENSE_HOST }}
          TYPESENSE_PROTOCOL: https
          TYPESENSE_PORT: 443
          CONFIG: ${{ steps.docsearch-config.outputs.json }}
